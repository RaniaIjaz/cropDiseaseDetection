name: CI

on:
  push:
  pull_request:

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disease-detection-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: disease-detection-backend/requirements-dev.txt

      - name: Install dev dependencies
        # requirements-dev.txt deliberately omits tensorflow, torch and
        # transformers. The app imports those lazily and the suite mocks every
        # model, so CI never downloads gigabytes of wheels.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Assert the heavy ML packages are absent
        # Guards the lazy-import boundary: if someone moves a tensorflow import
        # back to module scope, this fails here rather than silently making CI
        # slow (or red) later.
        run: |
          python - <<'PY'
          import importlib.util, sys
          leaked = []
          for mod in ("tensorflow", "torch", "transformers"):
              try:
                  if importlib.util.find_spec(mod) is not None:
                      leaked.append(mod)
              except ModuleNotFoundError:
                  pass
          if leaked:
              sys.exit(f"These should not be installed in CI: {leaked}")
          print("tensorflow / torch / transformers correctly absent")
          PY

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-placeholder-secret
          JWT_ALGORITHM: HS256
          BASE_URL: http://testserver
          GEMINI_API_KEY: ci-placeholder-key
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crop-disease-detection-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crop-disease-detection-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Every read of this has a localhost fallback, but pinning it keeps
          # the build output deterministic.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
